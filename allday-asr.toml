config_version = 1

[runtime]
device = "auto"

[asr]
language = "zh"
primary_model = "Qwen/Qwen3-ASR-1.7B"
forced_aligner_model = "Qwen/Qwen3-ForcedAligner-0.6B"
secondary_model = "FunAudioLLM/Fun-ASR-Nano-2512"
vram_profile = "auto"
window_seconds = 300.0
context_seconds = 5.0
max_new_tokens = 4096
primary_batch_size_16gb = 4
primary_batch_size_8gb = 1
speech_gate_fsmn_merge_gap_ms = 600
speech_gate_max_utterance_ms = 30000
speech_gate_inference_padding_ms = 750
speech_gate_output_padding_ms = 500
speech_gate_min_candidate_ms = 800
speech_gate_min_snr_db = 9.0
speech_gate_silero_threshold = 0.15
speech_gate_silero_min_speech_ms = 100
speech_gate_silero_min_silence_ms = 250
speech_gate_min_silero_overlap_ms = 500

[diarization]
backend = "pyannote-community-1"
model_id = "pyannote/speaker-diarization-community-1"
token_env = "HF_TOKEN"
min_primary_overlap_ratio = 0.50
