[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "allday-recording-asr"
version = "0.6.0"
description = "Local-first daily recording transcription and timeline pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==50.0.1",
    "funasr==1.4.4",
    "modelscope==1.39.1",
    "openai-codex==0.147.0",
    "qwen-asr==0.0.6",
    "transformers==4.57.6",
    "webauthn==3.0.0",
    "huggingface-hub==0.36.2",
    "tokenizers==0.22.2",
    "numpy>=2.0",
    "pyannote.audio==4.0.7",
    "psutil>=7,<8",
    "qrcode[pil]>=8.2,<9",
    "soundfile>=0.14,<0.15",
    "silero-vad==6.2.1",
    "tzdata>=2025.2",
    "typer>=0.27,<1",
    "zeroconf>=0.147,<1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.13.1",
]

[project.scripts]
allday-asr = "allday_asr.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
allday_asr = [
    "v3/web_assets/*.html",
    "v3/web_assets/*.svg",
    "v3/web_assets/assets/*.css",
    "v3/web_assets/assets/*.js",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI metadata through calls in parameter defaults by design.
"src/allday_asr/cli.py" = ["B008"]
"src/allday_asr/v3/interfaces/*.py" = ["B008"]
"src/allday_asr/v3/interfaces/transfer/*.py" = ["B008"]
