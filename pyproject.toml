[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "allday-recording-asr"
version = "0.4.2"
description = "Local-first daily recording transcription and timeline pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "funasr==1.4.4",
    "modelscope==1.39.1",
    "qwen-asr==0.0.6",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "tokenizers==0.22.2",
    "gradio==5.49.1",
    "numpy>=2.0",
    "rich>=15,<16",
    "soundfile>=0.14,<0.15",
    "tzdata>=2025.2",
    "typer>=0.27,<1",
]

[project.scripts]
allday-asr = "allday_asr.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
allday_asr = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]
